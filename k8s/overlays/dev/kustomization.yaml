apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
# Dev: image dibangun lokal lalu dimuat ke kind (kind load docker-image).
images:
  - name: ricky-rohaendi-portfolio
    newName: ricky-rohaendi-portfolio
    newTag: local

replicas:
  - name: portfolio
    count: 2
