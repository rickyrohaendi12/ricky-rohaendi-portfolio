name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      # Cocokkan dengan file CHECKSUMS di halaman rilis v0.6.7 sebelum dipercaya.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      K8S_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v7

      - name: Cache kubeconform binary
        id: kc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-linux-amd64

      - name: Install kubeconform
        if: steps.kc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar -xzf kubeconform.tar.gz -C ~/.local/bin kubeconform

      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache kubeconform schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ env.K8S_VERSION }}-${{ hashFiles('k8s/**') }}
          restore-keys: |
            kubeconform-schemas-${{ env.K8S_VERSION }}-

      - name: Build and validate overlays
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/kubeconform"
          mapfile -t dirs < <(find k8s -name kustomization.yaml -path '*overlays*' -exec dirname {} \;)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No kustomize overlays found under k8s/" >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -ignore-missing-schemas \
              -cache "$HOME/.cache/kubeconform" -kubernetes-version "$K8S_VERSION"
            echo "::endgroup::"
          done

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: .terraform-plugin-cache
          key: terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - name: Prepare plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend, with retry)
        working-directory: terraform
        run: |
          for attempt in 1 2 3; do
            terraform init -backend=false -input=false && exit 0
            echo "terraform init failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          exit 1

      - name: Validate
        working-directory: terraform
        run: terraform validate

      - name: IaC scan (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  docker:
    name: Build, scan, push image
    runs-on: ubuntu-latest
    needs: [test, secret-scan, k8s-validate]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Metadata (tag & label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (belum di-push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ricky-rohaendi-portfolio:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ricky-rohaendi-portfolio:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Login ke GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
